services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seller_ops
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  mock-amazon:
    build: .
    command: uvicorn mock_amazon.app:app --host 0.0.0.0 --port 8001
    environment:
      MOCK_FAIL_EVERY: "4"   # every 4th call answers 429, to exercise the retries
    ports: ["8001:8001"]

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/seller_ops
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      LWA_URL: http://mock-amazon:8001
      SP_API_URL: http://mock-amazon:8001
      ADS_API_URL: http://mock-amazon:8001
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      mock-amazon:
        condition: service_started
